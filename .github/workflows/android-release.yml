name: Build Android APK and Chrome extension ZIP
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "extension/**"
      - ".github/workflows/android-release.yml"
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          cache-provider: basic
      - name: Build Android APK
        run: gradle -p android assembleDebug
      - name: Package Chrome extension only
        shell: bash
        run: |
          mkdir -p release-files
          cp android/app/build/outputs/apk/debug/app-debug.apk release-files/SEIF-CUSTOM-Android.apk
          cd extension
          zip -r ../release-files/SEIF-CUSTOM-Chrome.zip . -x "*.DS_Store"
      - name: Publish downloadable assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('SEIF CUSTOM build {0}', github.run_number) }}
          generate_release_notes: true
          files: |
            release-files/SEIF-CUSTOM-Android.apk
            release-files/SEIF-CUSTOM-Chrome.zip
