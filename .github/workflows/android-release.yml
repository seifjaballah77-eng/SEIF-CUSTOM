name: Android release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-release.yml"
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build Android APK
        run: gradle -p android assembleDebug
      - name: Prepare downloadable files
        shell: bash
        run: |
          mkdir -p release-files
          cp android/app/build/outputs/apk/debug/app-debug.apk release-files/SEIF-CUSTOM-Android.apk
          git archive --format=zip --output=release-files/SEIF-CUSTOM-Source.zip HEAD
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('android-{0}', github.run_number) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('SEIF CUSTOM Android build {0}', github.run_number) }}
          generate_release_notes: true
          files: |
            release-files/SEIF-CUSTOM-Android.apk
            release-files/SEIF-CUSTOM-Source.zip
