<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111522"><title>SEIF CUSTOM</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<img id="bgImage" class="wallpaper-image" alt="" aria-hidden="true"><video id="bgVideo" class="wallpaper-video" muted loop playsinline aria-hidden="true"></video>
<div class="ambient" aria-hidden="true"></div><div class="shade" aria-hidden="true"></div>
<header class="topbar">
<a class="brand" href="#" aria-label="SEIF CUSTOM"><span class="brand-mark">S</span><span class="brand-copy"><strong>SEIF CUSTOM</strong><small>مساحة عملك، بطريقتك</small></span></a>
<div class="top-actions">
<button class="icon-button" id="wallpaperButton" type="button" title="إضافة خلفية" aria-label="إضافة خلفية من الكمبيوتر"><svg viewBox="0 0 24 24"><path d="M4 5.5h16A1.5 1.5 0 0 1 21.5 7v10a1.5 1.5 0 0 1-1.5 1.5H4A1.5 1.5 0 0 1 2.5 17V7A1.5 1.5 0 0 1 4 5.5Z"/><circle cx="8" cy="10" r="1.5"/><path d="m3.5 16 5-4 3 2 3.5-4 5.5 6"/></svg></button>
<button class="icon-button" id="themeButton" type="button" title="تبديل المظهر يدوياً" aria-label="تبديل المظهر"><svg viewBox="0 0 24 24"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"/></svg></button>
<button class="icon-button" id="settingsButton" type="button" title="إعدادات مختصرة" aria-label="الإعدادات" aria-expanded="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1a1.7 1.7 0 0 1-2.4 2.4l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a1.7 1.7 0 0 1-3.4 0v-.2a1.7 1.7 0 0 0-2.9-1.2l-.1.1a1.7 1.7 0 1 1-2.4-2.4l.1-.1a1.7 1.7 0 0 0-1.2-2.9H4a1.7 1.7 0 0 1 0-3.4h.2a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a1.7 1.7 0 1 1 2.4-2.4l.1.1a1.7 1.7 0 0 0 2.9-1.2V2a1.7 1.7 0 0 1 3.4 0v.2a1.7 1.7 0 0 0 2.9 1.2l.1-.1a1.7 1.7 0 1 1 2.4 2.4l-.1.1a1.7 1.7 0 0 0 1.2 2.9h.2a1.7 1.7 0 0 1 0 3.4h-.2a1.7 1.7 0 0 0-1.2 2.9Z"/></svg></button>
</div></header>
<main class="workspace">
<section class="welcome"><p class="eyebrow">مساحة هادئة للإنجاز</p><div id="clock" class="clock">--:--</div><div id="date" class="date"></div></section>
<form class="search-box" action="https://www.google.com/search" method="get" role="search"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg><input type="search" name="q" placeholder="ابحث في الويب…" autocomplete="off" aria-label="ابحث في الويب"><kbd>ENTER</kbd></form>
<section class="shortcuts-section"><div class="section-heading"><span>مواقعك</span><button class="add-shortcut" id="addLinkButton" type="button" aria-label="إضافة موقع" title="إضافة موقع">+</button></div><div class="shortcuts" id="shortcuts"></div></section>
<p class="hint">خلفيتك وإعداداتك تبقى على هذا الجهاز. لا نغيّر الطاقة أو المظهر تلقائياً.</p>
</main>
<aside class="settings-panel" id="settingsPanel" hidden aria-label="إعدادات مساحة العمل">
<div class="panel-heading"><strong>تخصيص سريع</strong><button id="closeSettings" class="close-button" type="button" aria-label="إغلاق">×</button></div>
<label class="range-row" for="glassRange"><span>شفافية اللوحات</span><output id="glassValue">42%</output></label><input id="glassRange" type="range" min="18" max="78" step="1" value="42"><label class="range-row" for="wallpaperOpacity"><span>وضوح الخلفية</span><output id="wallpaperOpacityValue">100%</output></label><input id="wallpaperOpacity" type="range" min="15" max="100" step="1" value="100"><label class="range-row" for="accentColor"><span>لون اللمسات</span><input id="accentColor" type="color" value="#c5d0ff" aria-label="لون اللمسات"></label><label class="range-row" for="shapeSelect"><span>شكل الاختصارات</span><select id="shapeSelect"><option value="soft">مربع ناعم</option><option value="round">دائري الحواف</option><option value="pill">كبسولة</option><option value="sharp">حواف حادة</option></select></label>
<label class="check-row"><input id="motionToggle" type="checkbox" checked><span>السماح بالحركة والخلفيات المتحركة</span></label><label class="check-row"><input id="autoTextToggle" type="checkbox" checked><span>لون أسماء المواقع تلقائي حسب الخلفية</span></label>
<div class="panel-actions"><button id="exportButton" type="button">تصدير الإعدادات</button><button id="importButton" type="button">استيراد الإعدادات</button><button id="removeWallpaperButton" class="quiet-danger" type="button">إزالة الخلفية</button></div>
<p class="panel-note">كل تغيير اختياري ويدوي. لا يتم تفعيل توفير الطاقة أو تبديل النهاري والليلي دون اختيارك.</p>
</aside>
<dialog id="linkDialog" class="dialog"><form id="linkForm">
<div class="dialog-heading"><strong>إضافة موقع</strong><button class="close-button" id="closeLinkDialog" type="button" aria-label="إغلاق">×</button></div>
<label for="linkName">اسم الموقع</label><input id="linkName" maxlength="28" required placeholder="مثلاً: موقع العمل">
<label for="linkUrl">الرابط</label><input id="linkUrl" type="text" required placeholder="https://example.com" dir="ltr">
<div class="dialog-actions"><button type="submit" class="primary-button">حفظ الموقع</button></div>
</form></dialog>
<input id="wallpaperInput" type="file" accept="image/*,video/mp4,video/webm,video/ogg" hidden>
<input id="importInput" type="file" accept="application/json,.json" hidden>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js" defer></script>
</body></html>
